# CANDIDATE — not active. Steps for .github/workflows/spatter-client-verify.yml
# (job: spatter-production-tests on ubuntu-24.04). Each step compiles the real
# Foundation-only production sources with a scripted fake transport; no network,
# SwiftUI, Combine or Supabase SDK is involved, so the suites run on Linux.
#
# Compile with -O: on Swift 5.10.1 (Linux) a -Onone build of an async @main
# hangs on ordinary generic collection code inside async frames (reproduced with
# `(0..<51).map { $0 }` in `static func main() async`; the same binary built with
# -O runs). -O is the release configuration and does not change behaviour under
# test. Verified locally on 2026-10-13: 7 + 9 + 6 + 7 = 29 cases PASS.
#
# scripts/verify_native_compile_sources.py DEPENDENCIES must list the shared
# sources (see REPORT.md "Coordinator actions") before these lists are added.
      - name: Verify community feed and profile clients against fake transports
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -O -parse-as-library \
            StickDeathInfinity/Models/CommunityModels.swift \
            StickDeathInfinity/Services/Social/CommunityTransport.swift \
            StickDeathInfinity/Services/Social/FeedClient.swift \
            StickDeathInfinity/Services/Social/ProfileClient.swift \
            Tests/CommunityFeed/main.swift \
            -o /tmp/sdi-community-feed-tests
          timeout 60s /tmp/sdi-community-feed-tests
      - name: Verify Rooms client, invitation consent and versioned command sync
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -O -parse-as-library \
            StickDeathInfinity/Models/CommunityModels.swift \
            StickDeathInfinity/Services/Social/CommunityTransport.swift \
            StickDeathInfinity/Services/Rooms/RoomsClient.swift \
            StickDeathInfinity/Services/Rooms/RoomSessionCoordinator.swift \
            Tests/CommunityRooms/main.swift \
            -o /tmp/sdi-community-rooms-tests
          timeout 60s /tmp/sdi-community-rooms-tests
      - name: Verify War Room voting, challenge phases, Calendar DST placement and server clock
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -O -parse-as-library \
            StickDeathInfinity/Models/CommunityModels.swift \
            StickDeathInfinity/Services/Social/CommunityTransport.swift \
            StickDeathInfinity/Services/WarRoom/WarRoomClient.swift \
            StickDeathInfinity/Services/Challenge/ChallengeLifecycleClient.swift \
            Tests/CommunityContests/main.swift \
            -o /tmp/sdi-community-contests-tests
          timeout 60s /tmp/sdi-community-contests-tests
      - name: Verify admin step-up policy, health, agents, finance and moderation queues
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -O -parse-as-library \
            StickDeathInfinity/Models/CommunityModels.swift \
            StickDeathInfinity/Services/Social/CommunityTransport.swift \
            StickDeathInfinity/Services/Social/AdminOperationsClient.swift \
            Tests/CommunityAdmin/main.swift \
            -o /tmp/sdi-community-admin-tests
          timeout 60s /tmp/sdi-community-admin-tests
