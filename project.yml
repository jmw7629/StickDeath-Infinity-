
name: StickDeathInfinity
options:
  bundleIdPrefix: com.willisnmb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    INFOPLIST_FILE: StickDeathInfinity/Info.plist
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""

targets:
  StickDeathInfinity:
    type: application
    platform: iOS
    sources:
      - path: StickDeathInfinity
        excludes:
          # Retired user messaging/calls are retained as history, never app code.
          - Services/LiveKitService.swift
          - Services/LiveKit
          - Services/Message
          - ViewModels/MessagesViewModel.swift
          - Views/Messages/MessagesView.swift
          - Views/Messages/ChatRoomView.swift
          - Views/Messages/CallsView.swift
          - Views/Messages/ContactsView.swift
          - Views/Messages/VideoCall
          - Views/Messages/WatchParty
          - Views/Collab/CreatorRoomView.swift
          - Views/Collab/WatchTogetherView.swift
    settings:
      base:
        INFOPLIST_FILE: StickDeathInfinity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.willisnmb.stickdeathinfinity
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: supabase-swift
      # StoreKit 2 is built into iOS 15+ — no external package needed
      # Stripe SDK removed: iOS subscriptions use StoreKit IAP per Apple policy
    entitlements:
      path: StickDeathInfinity/StickDeathInfinity.entitlements
    capabilities:
      Sign in with Apple: {}
      In-App Purchase: {}


  StickDeathInfinityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NativeUI
    dependencies:
      - target: StickDeathInfinity
    settings:
      base:
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.willisnmb.stickdeathinfinity.uitests
        TEST_TARGET_NAME: StickDeathInfinity

schemes:
  StickDeathInfinity:
    build:
      targets:
        StickDeathInfinity: all
        StickDeathInfinityUITests: [test]
    test:
      targets:
        - StickDeathInfinityUITests

packages:
  supabase-swift:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
