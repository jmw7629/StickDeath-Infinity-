
name: StickDeathInfinity
options:
  bundleIdPrefix: com.willisnmb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    INFOPLIST_FILE: StickDeathInfinity/Info.plist
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""

targets:
  StickDeathInfinity:
    type: application
    platform: iOS
    sources:
      - path: StickDeathInfinity
    settings:
      base:
        INFOPLIST_FILE: StickDeathInfinity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.willisbmb.StickDeathInfinity
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
      configs:
        # Public values only (origin, publishable key, product ids). Debug/CI
        # builds stay unconfigured so offline verification is unchanged.
        Release:
          SUPABASE_URL: https://gwcqlbjdvxebkxizfxsx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ESTaBouCYQb8AzPKGfS_5w_GNWI-otv
          SDI_OAUTH_PROVIDERS: google,github
          SDI_STOREKIT_PLAN_4_99_PRODUCT_ID: com.willisbmb.StickDeathInfinity.creator.monthly
          SDI_STOREKIT_PLAN_9_99_PRODUCT_ID: com.willisbmb.StickDeathInfinity.pro.monthly
          SDI_STOREKIT_PLAN_19_99_PRODUCT_ID: com.willisbmb.StickDeathInfinity.unlimited.monthly
    dependencies:
      - package: supabase-swift
        product: Supabase
      # StoreKit 2 is built into iOS 15+ — no external package needed
      # Stripe SDK removed: iOS subscriptions use StoreKit IAP per Apple policy
    entitlements:
      path: StickDeathInfinity/StickDeathInfinity.entitlements
    capabilities:
      Sign in with Apple: {}
      In-App Purchase: {}


  StickDeathInfinityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NativeUI
    dependencies:
      - target: StickDeathInfinity
    settings:
      base:
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.willisbmb.StickDeathInfinity.uitests
        TEST_TARGET_NAME: StickDeathInfinity

  StickDeathInfinityAuthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AuthState
    dependencies:
      - target: StickDeathInfinity
      - package: supabase-swift
        product: Supabase
    settings:
      base:
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.willisbmb.StickDeathInfinity.authtests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StickDeathInfinity.app/StickDeathInfinity"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"

schemes:
  StickDeathInfinity:
    build:
      targets:
        StickDeathInfinity: all
        StickDeathInfinityUITests: [test]
    test:
      targets:
        - StickDeathInfinityUITests

  StickDeathInfinityAuthTests:
    build:
      targets:
        StickDeathInfinity: [test]
        StickDeathInfinityAuthTests: [test]
    test:
      targets:
        - StickDeathInfinityAuthTests

packages:
  supabase-swift:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
