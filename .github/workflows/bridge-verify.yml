name: Bridge Verification

on:
  pull_request:
    paths:
      - "bridge/**"

jobs:
  bridge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m py_compile bridge/runner.py
      - name: Self-test
        run: python3 bridge/runner.py --self-test
      - name: Diff check
        run: git diff --check
