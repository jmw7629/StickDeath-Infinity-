name: SDI iOS Delivery
# Manual only (Actions tab -> Run workflow); it never runs on push or PR.
# TestFlight mode needs the seven secrets in docs/TESTFLIGHT_DISTRIBUTION.md.
# unsigned_review builds an offline, unsigned SDI Review device artifact only.
# Every distribution credential is a repository secret; the TestFlight job
# refuses to start when any secret is missing and never prints them. It
# uploads to TestFlight only; App Store release stays manual.
on:
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: Select the existing TestFlight upload or an unsigned isolated device review artifact
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - unsigned_review
      ref_note:
        description: Optional note recorded in the upload receipt
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: sdi-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate delivery mode
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      delivery_mode: ${{ steps.mode.outputs.delivery_mode }}
    steps:
      - name: Require an explicit supported manual delivery route
        id: mode
        env:
          SDI_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          SDI_EVENT_NAME: ${{ github.event_name }}
          SDI_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PYMODE'
          import os
          import re
          mode = os.environ["SDI_DELIVERY_MODE"]
          if (os.environ["SDI_EVENT_NAME"] != "workflow_dispatch" or
                  mode not in {"testflight", "unsigned_review"} or
                  not re.fullmatch(r"[0-9a-f]{40}", os.environ["SDI_EXPECTED_HEAD"])):
              raise SystemExit("Unsupported manual delivery route or source; no build/upload job is eligible")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("delivery_mode=" + mode + "\n")
          print("Validated the manual delivery route and exact source format")
          PYMODE
  testflight:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate.outputs.delivery_mode == 'testflight' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require every signing and upload secret
        env:
          HAS_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 != '' }}
          HAS_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 != '' }}
        run: |
          set -euo pipefail
          missing=""
          for name in HAS_CERT HAS_CERT_PASSWORD HAS_PROFILE HAS_TEAM HAS_KEY_ID HAS_ISSUER HAS_KEY; do
            if [ "${!name}" != "true" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight upload is not configured. Missing secrets:$missing. See docs/TESTFLIGHT_DISTRIBUTION.md."
            exit 2
          fi
      - name: Select an Xcode 26 toolchain
        # App Store Connect accepts uploads built with the iOS 26 SDK or later.
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner image; App Store Connect rejects older SDKs."
            ls -d /Applications/Xcode*.app
            exit 2
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
      - name: Install the distribution certificate and provisioning profile into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/sdi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Stamp the build number and archive with manual signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" StickDeathInfinity/Info.plist
          mkdir -p testflight-evidence
          git rev-parse HEAD > testflight-evidence/source-commit.txt
          echo "$BUILD_NUMBER" > testflight-evidence/build-number.txt
          printf '%s\n' "${{ github.event.inputs.ref_note }}" > testflight-evidence/note.txt
          xcodebuild -project StickDeathInfinity.xcodeproj -scheme StickDeathInfinity -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SDI.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            archive 2>&1 | tee testflight-evidence/archive.log | tail -40
      - name: Export the App Store package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.willisbmb.StickDeathInfinity</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SDI.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee testflight-evidence/export.log | tail -20
          shasum -a 256 "$RUNNER_TEMP"/export/*.ipa > testflight-evidence/ipa-sha256.txt
      - name: Upload to TestFlight with the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" \
            2>&1 | sed -E 's/(apiKey|apiIssuer) [^ ]+/\1 [redacted]/g' | tee testflight-evidence/upload.log | tail -20
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
      - name: Remove the temporary keychain and profile
        if: always()
        run: |
          set +e
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP"/export/*.ipa
          true
      - name: Preserve the upload receipt (no secrets, no binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdi-testflight-receipt-${{ github.sha }}-${{ github.run_number }}
          path: testflight-evidence/

  unsigned-review:
    name: Unsigned SDI Review device artifact
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate.outputs.delivery_mode == 'unsigned_review' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate an unsigned isolated arm64 device review artifact
        id: device-review
        timeout-minutes: 38
        env:
          SDI_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          SDI_EXPECTED_HEAD: ${{ github.sha }}
        run: python3 scripts/native-smoke/build_device_review_ci.py
      - name: Preserve unsigned device compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unsigned-device-review-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdi-device-review-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Preserve the validated unsigned device review package
        if: ${{ success() && steps.device-review.outputs.review_app_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unsigned-device-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdi-device-review-package/StickDeathInfinity-review-unsigned-iphoneos.zip
            ${{ runner.temp }}/sdi-device-review-package/manifest.json
            ${{ runner.temp }}/sdi-device-review-package/compile-provenance.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
