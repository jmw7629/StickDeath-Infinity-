name: SDI website deploy (GitHub Pages)
# Deploys the static website/ folder to GitHub Pages. It runs only on manual dispatch until the
# owner enables Pages (Settings → Pages → Source: GitHub Actions) and adds the custom domain
# stickdeathinfinity.com with its DNS records (docs/WEBSITE_HOSTING.md). Once that is done, the
# `push` trigger below can be uncommented so every merge to main redeploys the reviewed bytes.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['website/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sdi-website-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Help centre and discovery files are in sync
        run: |
          node scripts/website/check_help.mjs --check
          node scripts/website/build_site.mjs --check
      - name: Add the custom-domain file for Pages
        run: printf 'stickdeathinfinity.com\n' > website/CNAME
      - uses: actions/upload-pages-artifact@v3 # version tag; pin to a reviewed SHA once the owner enables Pages
        with:
          path: website
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # version tag; pin to a reviewed SHA once the owner enables Pages
