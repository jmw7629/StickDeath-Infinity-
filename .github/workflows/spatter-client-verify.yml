name: SDI Native Recovery Verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdi-native-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  spatter-production-tests:
    runs-on: ubuntu-24.04
    container: swift:5.9-jammy
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile and execute actual Foundation production source
        shell: bash
        run: |
          set -euo pipefail
          swiftc --version
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            Tests/SpatterClient/main.swift \
            -o /tmp/sdi-spatter-client-tests
          timeout 60s /tmp/sdi-spatter-client-tests
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify provider removal, production wiring and exact diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 scripts/verify_spatter_client.py
  native-ios-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify complete production model encoding and historical decoding
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            Tests/NativeModels/main.swift \
            -o "$RUNNER_TEMP/sdi-native-model-tests"
          "$RUNNER_TEMP/sdi-native-model-tests"
      - name: Verify actual production device storage and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            Tests/DeviceStorage/main.swift \
            -o "$RUNNER_TEMP/sdi-device-storage-tests"
          "$RUNNER_TEMP/sdi-device-storage-tests"
      - name: Verify production offline Studio document journeys
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            Tests/StudioDocument/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-document-tests"
          "$RUNNER_TEMP/sdi-studio-document-tests"
      - name: Verify deterministic native brush geometry and actual pixels
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            Tests/StudioBrushes/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-brush-tests"
          "$RUNNER_TEMP/sdi-studio-brush-tests"
      - name: Verify native brush edits, live rendering and persistence
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Services/StudioAudioImportService.swift \
            StickDeathInfinity/Services/StudioAudioPreviewSession.swift \
            Tests/StudioBrushIntegration/main.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Views/Studio/StudioFrameRenderer.swift \
            StickDeathInfinity/Services/StudioExportService.swift \
            StickDeathInfinity/Extensions/Color+SD.swift \
            -o "$RUNNER_TEMP/sdi-studio-brush-integration-tests"
          "$RUNNER_TEMP/sdi-studio-brush-integration-tests"
      - name: Verify actual SwiftUI renderer pixels on macOS
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Views/Studio/StudioFrameRenderer.swift \
            StickDeathInfinity/Extensions/Color+SD.swift \
            Tests/StudioRenderer/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-renderer-tests"
          "$RUNNER_TEMP/sdi-studio-renderer-tests"
      - name: Verify real PNG exports and cancellation cleanup
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Views/Studio/StudioFrameRenderer.swift \
            StickDeathInfinity/Extensions/Color+SD.swift \
            StickDeathInfinity/Services/StudioExportService.swift \
            Tests/StudioExport/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-export-tests"
          "$RUNNER_TEMP/sdi-studio-export-tests"
      - name: Verify typed Studio command transactions
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            Tests/StudioCommands/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-command-tests"
          "$RUNNER_TEMP/sdi-studio-command-tests"
      - name: Verify Studio command edits persist through the actual view model
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            Tests/StudioCommandIntegration/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-command-integration-tests"
          "$RUNNER_TEMP/sdi-studio-command-integration-tests"
      - name: Verify real audio import, measured waveforms and cancellation
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/Services/StudioAudioImportService.swift \
            Tests/StudioAudioImport/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-audio-import-tests"
          "$RUNNER_TEMP/sdi-studio-audio-import-tests"
      - name: Verify imported audio edits, preview and atomic persistence
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Services/StudioAudioImportService.swift \
            StickDeathInfinity/Services/StudioAudioPreviewSession.swift \
            Tests/StudioAudioIntegration/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-audio-integration-tests"
          "$RUNNER_TEMP/sdi-studio-audio-integration-tests"
      - name: Verify real photo decoding, orientation and cancellation
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Services/StudioImageImportService.swift \
            Tests/StudioImageImport/main.swift \
            -o "$RUNNER_TEMP/sdi-studio-image-import-tests"
          "$RUNNER_TEMP/sdi-studio-image-import-tests"
      - name: Verify real local and cloud Spatter conversation state
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Services/Spatter/SpatterKnowledgeBase.swift \
            StickDeathInfinity/ViewModels/SpatterAIViewModel.swift \
            Tests/SpatterConversation/main.swift \
            -o "$RUNNER_TEMP/sdi-spatter-conversation-tests"
          "$RUNNER_TEMP/sdi-spatter-conversation-tests"
      - name: Verify explicit local motion recipes through production Studio commands
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Models/SpatterMotionRecipe.swift \
            Tests/SpatterMotionRecipe/main.swift \
            -o "$RUNNER_TEMP/sdi-spatter-motion-tests"
          "$RUNNER_TEMP/sdi-spatter-motion-tests"
      - name: Verify cancellable Studio edits and factual persistence state
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            StickDeathInfinity/Models/Models.swift \
            StickDeathInfinity/Models/StudioBrush.swift \
            StickDeathInfinity/Services/StudioBrushRenderer.swift \
            StickDeathInfinity/Models/StudioDocument.swift \
            StickDeathInfinity/Models/StudioCommands.swift \
            StickDeathInfinity/App/AppConfig.swift \
            StickDeathInfinity/App/SpatterBackendClient.swift \
            StickDeathInfinity/Storage/DeviceStorageManager.swift \
            StickDeathInfinity/ViewModels/StudioViewModel.swift \
            StickDeathInfinity/Models/SpatterMotionRecipe.swift \
            StickDeathInfinity/Services/Spatter/SpatterStudioEditSession.swift \
            Tests/SpatterStudioEditSession/main.swift \
            -o "$RUNNER_TEMP/sdi-spatter-edit-session-tests"
          "$RUNNER_TEMP/sdi-spatter-edit-session-tests"
      - name: Build checked-in native iOS target without signing or deployment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project StickDeathInfinity.xcodeproj \
            -scheme StickDeathInfinity \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sdi-native-build" \
            CODE_SIGNING_ALLOWED=NO build
          echo 'XCODE_IOS_BUILD=PASS'
      - name: Exercise the native Studio and capture simulator evidence
        id: native-smoke
        shell: bash
        run: |
          set -euo pipefail
          export SDI_SMOKE_SIMULATOR_UDID="$(python3 scripts/native-smoke/select_simulator.py)"
          set +e
          bash scripts/native-smoke/run_smoke_ci.sh
          sdi_status=$?
          set -e
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          marker = root / "sdi-native-smoke-artifact-path.txt"
          if marker.is_file():
              artifact = pathlib.Path(marker.read_text().strip()).resolve()
              if not artifact.is_relative_to(root) or not artifact.is_dir() or not artifact.name.startswith("sdi-native-smoke."):
                  raise SystemExit("Invalid native evidence path")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("artifact_path=" + str(artifact) + "\n")
          PY
          exit "$sdi_status"
      - name: Preserve native smoke evidence from this exact source
        if: always() && steps.native-smoke.outputs.artifact_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-studio-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.native-smoke.outputs.artifact_path }}
          retention-days: 3
          compression-level: 3
          if-no-files-found: error
